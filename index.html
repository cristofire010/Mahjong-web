<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mahjong Solitario</title>
<style>
:root{
  --bg:#072419;
  --bg-gradient:radial-gradient(circle at center, #0f402e 0%, #051a12 100%);
  --fg:#ece8dc;
  --card:#18382b;
  --muted:#9fb0aa;
  --acc:#eab308;
  --edge:#114d33;
  --sel:#f59e0b;
  --hint:#22c55e;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px)
}
*{box-sizing:border-box;user-select:none;-webkit-user-select:none}
html,body{margin:0;padding:0;width:100%;height:100%;background:var(--bg);background:var(--bg-gradient);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{padding:8px 12px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;overflow:hidden}

/* Top HUD */
.top-hud {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  max-width: 500px;
  padding: 4px 8px;
  flex-shrink: 0;
  gap: 6px;
}
.hud-stat {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  background: rgba(0,0,0,0.4);
  border: 1.5px solid rgba(255,255,255,0.15);
  padding: 6px 8px;
  border-radius: 20px;
  font-weight: 800;
  box-shadow: 0 3px 8px rgba(0,0,0,0.4);
  white-space: nowrap;
}
.iq-badge { color: #fef08a; font-size: 14px; }
.gems-badge { color: #38bdf8; font-size: 14px; }
.level-badge { color: #a7f3d0; font-size: 14px; }

/* Pulsante Temporaneo Win */
.temp-win-btn {
  background: linear-gradient(135deg, #ef4444, #b91c1c);
  color: #fff;
  border: 1.5px solid #fca5a5;
  border-radius: 20px;
  padding: 6px 10px;
  font-size: 12px;
  font-weight: 900;
  cursor: pointer;
  box-shadow: 0 3px 8px rgba(0,0,0,0.4);
  white-space: nowrap;
  transition: transform 0.15s ease;
}
.temp-win-btn:active { transform: scale(0.92); }

.hud-icon { width: 18px; height: 18px; display: inline-block; vertical-align: middle; flex-shrink: 0; }

/* Vassoio Holder Bar */
#holder-container{display:flex;justify-content:center;margin:4px 0;width:100%;flex-shrink:0;min-height:74px}
#holder-bar{
  display:flex;
  gap:10px;
  background: transparent;
  border: none;
  box-shadow: none;
  padding: 4px 0;
  align-items: center;
  justify-content: center;
}
.holder-slot{display:none}

/* Canvas di Gioco Centrato */
#wrap{
  flex: 1;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: auto;
  padding: 10px;
}
#board{
  position: relative;
  margin: auto;
  display: block;
}

/* Tessere 3D */
.t {
  position: absolute;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(145deg, #ffffff, #f7f1df 60%, #e2d3aa);
  color: #222;
  border-radius: 10px;
  border: 1.5px solid #c4b689;
  box-shadow: -3px 4px 0 #13593b, -5px 6px 0 #072419, 3px 6px 10px rgba(0,0,0,0.5);
  cursor: pointer;
  user-select: none;
  font-weight: 700;
  transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.15s ease, box-shadow 0.2s ease;
}

.t.appear {
  animation: tileAppear 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) backwards;
}

@keyframes tileAppear {
  0% { opacity: 0; transform: scale(0.4) translateY(30px); }
  100% { opacity: 1; transform: scale(1) translateY(0); }
}

.t:hover {
  transform: translateY(-4px);
  filter: brightness(1.06);
}

.t.blk {
  cursor: pointer;
}

.t.sel{
  outline: 4px solid var(--sel);
  transform: translateY(-10px) scale(1.05);
  z-index: 99!important;
  box-shadow: -2px 10px 0 #13593b, 0 14px 24px rgba(245,158,11,0.5);
}

.t.hint{
  outline: 4px solid var(--hint);
  animation: pulseHint 0.6s infinite alternate;
}
@keyframes pulseHint {
  0% { transform: scale(1); filter: brightness(1); }
  100% { transform: scale(1.08); filter: brightness(1.25); }
}

.t.flying {
  position: fixed !important;
  transition: all 0.35s cubic-bezier(0.25, 1, 0.5, 1);
  z-index: 9999 !important;
  pointer-events: none;
}

.t svg{width:100%;height:100%;padding:4px;pointer-events:none}

/* Tooltip & Toast */
.lock-banner{position:fixed;background:rgba(0,0,0,0.92);color:#fff;padding:8px 16px;border-radius:20px;font-size:13px;font-weight:bold;border:1px solid #ef4444;box-shadow:0 4px 14px rgba(0,0,0,0.7);pointer-events:none;z-index:9999;display:flex;align-items:center;gap:8px;animation:shake 0.25s}
.lock-arrow{color:#ef4444;font-weight:900}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* Toast Notifica Combo con Alto Contrasto */
#combo-toast{
  position:fixed;
  top:38%;
  left:50%;
  transform:translate(-50%,-50%) scale(0.5);
  opacity:0;
  pointer-events:none;
  z-index:9000;
  text-align:center;
  background: rgba(4, 18, 12, 0.85);
  border: 2px solid rgba(234, 179, 8, 0.8);
  padding: 10px 24px;
  border-radius: 28px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(234, 179, 8, 0.3);
  backdrop-filter: blur(8px);
  transition:all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
#combo-toast.show{
  transform:translate(-50%,-50%) scale(1.1);
  opacity:1;
}
.combo-title{
  font-size:38px;
  font-weight:950;
  background:linear-gradient(to bottom, #ffffff, #fef08a, #eab308);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  filter: drop-shadow(0 3px 6px rgba(0,0,0,0.9));
  letter-spacing: 1px;
}
.combo-sub{
  font-size:15px;
  color:#a7f3d0;
  font-weight:800;
  margin-top: 2px;
  text-shadow: 0 2px 4px rgba(0,0,0,0.9);
}

/* Banner Notifica Integrato */
#toast-banner {
  position: fixed;
  top: 70px;
  left: 50%;
  transform: translateX(-50%) translateY(-20px);
  background: rgba(239, 68, 68, 0.95);
  color: #fff;
  padding: 10px 20px;
  border-radius: 24px;
  font-size: 14px;
  font-weight: bold;
  box-shadow: 0 6px 20px rgba(0,0,0,0.6);
  border: 1px solid rgba(255,255,255,0.3);
  z-index: 99999;
  opacity: 0;
  pointer-events: none;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
#toast-banner.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* Barra Controlli Inferiore */
.bottom-bar {
  display: flex;
  justify-content: space-around;
  align-items: center;
  width: 100%;
  max-width: 500px;
  margin-top: 4px;
  padding: 4px 0;
  flex-shrink: 0;
}
.action-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  background: none;
  border: none;
  color: #fff;
  cursor: pointer;
  padding: 0;
  position: relative;
}
.action-btn .btn-circle {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background: linear-gradient(135deg, #7c3a00, #451a03);
  border: 2px solid #b87333;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(0,0,0,0.6);
  transition: transform 0.15s ease;
  position: relative;
}
.action-btn:active .btn-circle { transform: scale(0.92); }
.action-btn .btn-circle svg { width: 24px; height: 24px; fill: #fef08a; flex-shrink: 0; }

.badge-count {
  position: absolute;
  top: -4px;
  right: -4px;
  background: #0284c7;
  color: #fff;
  border: 1.5px solid #fff;
  font-size: 11px;
  font-weight: 800;
  min-width: 20px;
  height: 20px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 4px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.5);
}
.badge-count.buy-mode {
  background: #ea580c;
  font-size: 9px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 2px;
  padding: 0 5px;
}
.badge-count.buy-mode svg { width: 12px; height: 12px; flex-shrink: 0; }

.action-btn span {
  font-size: 11px;
  margin-top: 3px;
  color: #cbd5e1;
  font-weight: 600;
}

/* Porte Shoji & Modal */
.shoji-door{position:fixed;top:0;bottom:0;width:50%;background:#2b170b url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40"><rect width="40" height="40" fill="%232b170b"/><path d="M0 0h40v40H0z" fill="none" stroke="%234a2c17" stroke-width="2"/></svg>');z-index:9999;transition:transform 0.7s cubic-bezier(0.77,0,0.175,1)}
#door-left{left:0;border-right:4px solid #1a0d05}
#door-right{right:0;border-left:4px solid #1a0d05}
.shoji-door.open-left{transform:translateX(-100%)}
.shoji-door.open-right{transform:translateX(100%)}

#ov{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:9000;backdrop-filter:blur(4px);animation: fadeIn 0.3s ease}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

#ov .modal-card {
  background: var(--card);
  border: 2px solid #b87333;
  padding: 24px;
  border-radius: 20px;
  text-align: center;
  max-width: 320px;
  width: 90%;
  box-shadow: 0 10px 28px rgba(0,0,0,0.8);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  animation: scaleUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
@keyframes scaleUp { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

.trophy-icon {
  width: 54px;
  height: 54px;
  flex-shrink: 0;
  filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
}

#ov h2 { margin: 0; color: #fef08a; font-size: 22px; font-weight: 950; }
#ov p { margin: 0; color: #ece8dc; font-size: 14px; }

.reward-box {
  background: rgba(0,0,0,0.35);
  border-radius: 12px;
  padding: 10px 16px;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  border: 1px solid rgba(255,255,255,0.1);
}
.reward-title { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
.reward-item {
  color: #38bdf8;
  font-weight: 900;
  font-size: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.modal-actions {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

#ov button {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  font-size: 15px;
  font-weight: bold;
  background: linear-gradient(135deg, #eab308, #ca8a04);
  border: none;
  color: #000;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  box-shadow: 0 4px 12px rgba(234, 179, 8, 0.3);
  transition: transform 0.15s ease;
}
#ov button:active { transform: scale(0.96); }
#ov button svg { width: 18px; height: 18px; fill: currentColor; flex-shrink: 0; }

#ov button.btn-secondary {
  background: linear-gradient(135deg, #0284c7, #0369a1);
  color: #fff;
  box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
}
</style>
</head>

<!-- Porte Shoji -->
<div id="door-left" class="shoji-door open-left"></div>

<!-- Top HUD -->
<div class="top-hud">
  <div class="hud-stat level-badge">Liv. <span id="lvl-val">1</span></div>
  <button class="temp-win-btn" onclick="instantWin()" title="Completamento Istantaneo Test">⚡ Vinci Subito</button>

<!-- Banner Toast Integrato per Avvisi -->

<div id="combo-toast">

<script>
const G = [
  ...[..."一二三四五六七八九"].map(s=>[s,0]),
  ...[..."①②③④⑤⑥⑦⑧⑨"].map(s=>[s,1]),
  ...[..."⑴⑵⑶⑷⑸⑹⑺⑻⑼"].map(s=>[s,2]),
  ...[..."東南西北"].map(s=>[s,3]),
  ["中",0],["發",2],["白",1],
  ["bamboo",2], ["flower",1], ["shield",0], ["star",3],
  ["sun",2], ["moon",1], ["leaf",0], ["cloud",3],
  ["ring",1], ["flame",0], ["water",2], ["gem",3]
];

function getLevelLayout(n) {
  const baseW = Math.min(6 + Math.floor(n / 2), 14);
  const baseH = Math.min(4 + Math.floor(n / 3), 7);
  const layers = Math.min(1 + Math.floor(n / 3), 5);
  
  const layout = [];
  for (let z = 0; z < layers; z++) {
    const w = Math.max(2, baseW - z * 2);
    const h = Math.max(1, baseH - z);
    const offsetX = Math.floor((baseW - w) / 2);
    const offsetY = Math.floor((baseH - h) / 2);
    layout.push([offsetX, offsetY, w, h]);
  }
  return { k: baseW * baseH, l: layout };
}

let iq = 40.0, comboCount = 0, maxComboInLevel = 0, holder = [], isNewGameAnim = true, isAnimatingFlight = false;
let currentLevel = 0;
let gems = 0;

let uses = { shuffle: 2, hint: 3, undo: 3 };
const COSTS = { shuffle: 35, hint: 25, undo: 20 };

function layoutOld(n){
 const L = getLevelLayout(n), out=[];
 L.l.forEach((r,z)=>{for(let i=0;i<r[2];i++)for(let j=0;j<r[3];j++)out.push({x:(r[0]+i)*2,y:Math.round((r[1]+j)*2),z,type:0,gone:false})});
 if(out.length%2)out.pop();
 return out;
}

const PR=[[1],[1,1],[1,1,1],[2,2],[2,1,2],[2,2,2],[1,2,2,2],[2,2,2,2],[3,3,3]];

function svgOf(t){
 let s='<svg viewBox="0 0 40 52" xmlns="http://www.w3.org/2000/svg">';
 const tx=(c,y,sz,f,w)=>`<text x="20" y="${y}" font-size="${sz}" fill="${f}" text-anchor="middle" font-weight="${w||700}" font-family="'Noto Serif CJK SC','Songti SC',SimSun,sans-serif">${c}</text>`;
 
 const idx = Math.abs(t) % G.length;
 const item = G[idx];
 const val = Array.isArray(item) ? item[0] : item;
 const cat = Array.isArray(item) ? item[1] : 0;
 
 if(idx < 9){
   s += tx('一二三四五六七八九'[idx], 26, 22, '#1e293b') + tx('萬', 46, 16, '#b91c1c');
 } else if(idx < 18){
   const n = (idx % 9) + 1, rows = PR[n-1], R = rows.length, rh = (52 - 14) / R, C = ['#b91c1c','#1d4ed8','#15803d'];
   rows.forEach((c, ri) => {
     const cy = 7 + rh * (ri + 0.5);
     for(let j = 0; j < c; j++){
       const cx = 40 * (j + 1) / (c + 1), col = C[(ri + j) % 3];
       const r = Math.min(rh * 0.45, 40 / (c + 1) * 0.42, n === 1 ? 12 : 6.5);
       s += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${n===1?C[0]:col}"/><circle cx="${cx}" cy="${cy}" r="${r*.6}" fill="#fff"/><circle cx="${cx}" cy="${cy}" r="${r*.3}" fill="${n===1?'#15803d':col}"/>`;
     }
   });
 } else if(idx < 27){
   const n = (idx % 9) + 1, rows = PR[n-1], R = rows.length, rh = (52 - 14) / R, C = ['#b91c1c','#1d4ed8','#15803d'];
   rows.forEach((c, ri) => {
     const cy = 7 + rh * (ri + 0.5);
     for(let j = 0; j < c; j++){
       const cx = 40 * (j + 1) / (c + 1);
       const h = rh * 0.8, w = n === 1 ? 8 : 5;
       s += `<rect x="${cx-w/2}" y="${cy-h/2}" width="${w}" height="${h}" rx="${w/2}" fill="${n===1||ri%2?'#15803d':'#166534'}"/><rect x="${cx-w/2}" y="${cy-0.6}" width="${w}" height="1.4" fill="${C[0]}"/>`;
     }
   });
 } else if(idx < 31){
   s += `<rect x="4" y="4" width="32" height="44" rx="4" fill="none" stroke="#94a3b8" stroke-width="1"/>` + tx('東南西北'[idx-27], 34, 26, '#0f172a');
 } else if(idx === 31) {
   s += tx('中', 38, 32, '#b91c1c');
 } else if(idx === 32) {
   s += tx('發', 38, 30, '#15803d');
 } else if(idx === 33) {
   s += '<rect x="7" y="9" width="26" height="34" rx="4" fill="none" stroke="#1d4ed8" stroke-width="3"/><rect x="12" y="15" width="16" height="22" rx="2" fill="none" stroke="#1d4ed8" stroke-width="1.2"/>';
 } else {
   if(val === 'bamboo') {
     s += '<path d="M20 10v32M15 15h10M15 26h10M15 37h10" stroke="#15803d" stroke-width="3" stroke-linecap="round"/>';
   } else if(val === 'flower') {
     s += '<circle cx="20" cy="26" r="6" fill="#b91c1c"/><circle cx="20" cy="14" r="5" fill="#f43f5e"/><circle cx="20" cy="38" r="5" fill="#f43f5e"/><circle cx="10" cy="26" r="5" fill="#f43f5e"/><circle cx="30" cy="26" r="5" fill="#f43f5e"/>';
   } else if(val === 'star') {
     s += '<polygon points="20,10 24,22 36,22 26,30 30,42 20,35 10,42 14,30 4,22 16,22" fill="#eab308"/>';
   } else if(val === 'shield') {
     s += '<path d="M20 10l10 4v12c0 6-4 10-10 14-6-4-10-8-10-14V14l10-4z" fill="none" stroke="#1d4ed8" stroke-width="3"/>';
   } else if(val === 'sun') {
     s += '<circle cx="20" cy="26" r="8" fill="#ea580c"/>' +
          '<path d="M20 11l2.5 5h-5z M20 41l2.5-5h-5z M35 26l-5 2.5v-5z M5 26l5 2.5v-5z M30.6 15.4l-1.8 5.1-3.5-3.5z M9.4 36.6l1.8-5.1 3.5 3.5z M30.6 36.6l-5.1-1.8 3.5-3.5z M9.4 15.4l5.1 1.8-3.5 3.5z" fill="#ea580c"/>' +
          '<circle cx="20" cy="26" r="5" fill="#fef08a"/>';
   } else if(val === 'moon') {
     s += '<path d="M24 12a12 12 0 100 28 14 14 0 010-28z" fill="#0f172a"/>';
   } else if(val === 'leaf') {
     s += '<path d="M20 12c8 0 12 8 12 16-8 0-12-8-12-16zM20 12v28" fill="#15803d" stroke="#15803d" stroke-width="2"/>';
   } else if(val === 'cloud') {
     s += '<path d="M12 32a6 6 0 012-11 8 8 0 0114 2 6 6 0 012 11H12z" fill="#64748b"/>';
   } else if(val === 'ring') {
     s += '<circle cx="20" cy="26" r="9" fill="none" stroke="#b91c1c" stroke-width="4"/><circle cx="20" cy="26" r="4" fill="none" stroke="#eab308" stroke-width="2"/>';
   } else if(val === 'flame') {
     s += '<path d="M20 10c0 8-6 12-6 18a6 6 0 0012 0c0-6-6-10-6-18z" fill="#ea580c"/>';
   } else if(val === 'water') {
     s += '<path d="M12 26c4-4 8 4 12 0s8-4 12 0M12 33c4-4 8 4 12 0s8-4 12 0" fill="none" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>';
   } else if(val === 'gem') {
     s += '<polygon points="20,10 32,22 20,42 8,22" fill="#38bdf8"/><polygon points="20,10 32,22 20,26" fill="#bae6fd"/><polygon points="20,10 8,22 20,26" fill="#7dd3fc"/>';
   } else {
     s += '<circle cx="20" cy="26" r="8" fill="#eab308"/><circle cx="20" cy="26" r="4" fill="#b91c1c"/>';
   }
 }
 return s + '</svg>';
}

const $=i=>document.getElementById(i);
let T=[],lvl=0,hist=[],hintIds=[];
const sh=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

function blocked(a,list){
 let l=false,r=false;
 for(const b of list){
  if(b===a||b.gone)continue;
  const dx=b.x-a.x,dy=b.y-a.y;
  if(Math.abs(dy)>=2)continue;
  if(b.z===a.z+1&&Math.abs(dx)<2)return true;
  if(b.z===a.z){if(dx<0&&dx>=-2)l=true;if(dx>0&&dx<=2)r=true}
 }
 return l&&r;
}

const free=list=>list.filter(a=>!a.gone&&!blocked(a,list));

function assignAntiNeighbor(list, pairTypes){
 for(let tries=0; tries<400; tries++){
  const bag = sh(pairTypes.slice());
  const w = list.map(a=>({...a, gone:false}));
  const res = new Map();
  let ok = true;
  
  for(let n=0; n<list.length/2; n++){
   const f = free(w);
   if(f.length < 2){ok = false; break;}
   sh(f);
   const a = f[0], b = f[1];
   
   let chosenTy = null;
   let chosenIdx = -1;
   
   for(let idx=0; idx<bag.length; idx++){
    const ty = bag[idx];
    let hasNeighbor = false;
    for(const other of w){
     if(other.gone && other.type === ty){
      if(Math.abs(other.x - a.x) <= 2 && Math.abs(other.y - a.y) <= 2) { hasNeighbor = true; break; }
      if(Math.abs(other.x - b.x) <= 2 && Math.abs(other.y - b.y) <= 2) { hasNeighbor = true; break; }
     }
    }
    if(!hasNeighbor){ chosenTy = ty; chosenIdx = idx; break; }
   }
   
   if(chosenTy === null){
    chosenIdx = bag.length - 1;
    chosenTy = bag[chosenIdx];
   }
   
   bag.splice(chosenIdx, 1);
   
   res.set(list.indexOf(list.find(q=>q.x===a.x&&q.y===a.y&&q.z===a.z)), chosenTy);
   res.set(list.indexOf(list.find(q=>q.x===b.x&&q.y===b.y&&q.z===b.z)), chosenTy);
   a.type = b.type = chosenTy;
   a.gone = b.gone = true;
  }
  if(ok) return res;
 }
 return null;
}

function triggerDoors(callback){
 const dl=$('door-left'), dr=$('door-right');
 dl.classList.remove('open-left'); dr.classList.remove('open-right');
 setTimeout(()=>{
   if(callback) callback();
   dl.classList.add('open-left'); dr.classList.add('open-right');
 },500);
}

let toastTimeout;
function showToast(msg) {
  $('toast-msg').textContent = msg;
  const toast = $('toast-banner');
  toast.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => {
    toast.classList.remove('show');
  }, 2000);
}

function updateHUD(){
  $('lvl-val').textContent = currentLevel + 1;
  $('iq-val').textContent = iq.toFixed(1);
  $('gems-val').textContent = gems;

  const updateBtnBadge = (id, count, cost) => {
    const el = $(id);
    if (count > 0) {
      el.textContent = count;
      el.classList.remove('buy-mode');
    } else {
      el.innerHTML = `<svg class="hud-icon"><use href="#svg-gem"/></svg>${cost}`;
      el.classList.add('buy-mode');
    }
  };

  updateBtnBadge('badge-bs', uses.shuffle, COSTS.shuffle);
  updateBtnBadge('badge-bh', uses.hint, COSTS.hint);
  updateBtnBadge('badge-bu', uses.undo, COSTS.undo);
}

function newGame(n){
 isNewGameAnim = true;
 triggerDoors(()=>{
  currentLevel = n;
  lvl = n; holder = []; hist = []; hintIds = []; comboCount = 0; maxComboInLevel = 0;
  iq = 40.0 + n * 2.5;
  
  let tiles, res, tries = 0;
  do {
   tiles = layoutOld(n);
   const totalPairs = tiles.length / 2;
   const pool = sh([...Array(G.length).keys()]);
   const k = Math.min(totalPairs, pool.length);
   const ts = pool.slice(0, k);
   const pt = [];
   for(let i=0; i<totalPairs; i++){
     pt.push(ts[i % k]);
   }
   res = assignAntiNeighbor(tiles, sh(pt));
   tries++;
  } while(!res && tries < 120);
  
  tiles.forEach((t,i)=>t.type=res.get(i));
  T = tiles;
  $('ov').style.display = 'none';
  render();
  setTimeout(()=>{ isNewGameAnim = false; }, 400);
 });
}

function render(){
 updateHUD();
 const B=$('board');B.innerHTML='';
 const mx=Math.max(...T.map(t=>t.x))+2,my=Math.max(...T.map(t=>t.y))+2,mz=Math.max(...T.map(t=>t.z));
 
 const availW = window.innerWidth - 30;
 const availH = window.innerHeight - 200;
 
 let w = Math.min(64, Math.floor(availW / (mx/2 + mz*0.12)));
 let hByH = Math.floor(availH / (my/2 + mz*0.12));
 w = Math.min(w, hByH);
 w = Math.max(w, 42);

 const h=Math.round(w*1.32), u=w/2, v=h/2, d=w*0.11;
 
 const boardW = mx*u + mz*d + 12;
 const boardH = my*v + mz*d + 14;
 B.style.width=boardW+'px';
 B.style.height=boardH+'px';

 const f=new Set(free(T));
 [...T.keys()].sort((a,b)=>T[a].z-T[b].z).forEach(i=>{
  const t=T[i];if(t.gone)return;
  const e=document.createElement('div');
  const g=G[Math.abs(t.type) % G.length];
  let cls = 't c' + (Array.isArray(g)?g[1]:0);
  if(!f.has(t)) cls += ' blk';
  if(hintIds.includes(i)) cls += ' hint';
  if(isNewGameAnim) cls += ' appear';
  
  e.className = cls;
  e.style.cssText=`left:${t.x*u+t.z*d}px;top:${t.y*v-t.z*d+mz*d}px;width:${w}px;height:${h}px;z-index:${t.z*10+1};${isNewGameAnim ? 'animation-delay:'+((t.z*0.03)+(i*0.005))+'s' : ''}`;
  e.innerHTML=svgOf(t.type);
  e.dataset.index = i;
  e.onclick=(ev)=>click(i, ev);
  B.appendChild(e);
 });

 const holderBar=$('holder-bar');
 holderBar.innerHTML='';
 holder.forEach((item)=>{
   const div=document.createElement('div');
   const g=G[Math.abs(item.type) % G.length];
   div.className='t c'+(Array.isArray(g)?g[1]:0);
   div.style.cssText='position:relative;width:48px;height:64px;';
   div.innerHTML=svgOf(item.type);
   holderBar.appendChild(div);
 });

 const left=T.filter(t=>!t.gone).length;
 if(left===0 && holder.length===0) return win();
 if(holder.length>=4){
   setTimeout(gameOver, 300);
 }
}

function instantWin() {
  T.forEach(t => t.gone = true);
  holder = [];
  win();
}

function showLockTooltip(x, y){
 const banner=document.createElement('div');
 banner.className='lock-banner';
 banner.innerHTML='<span class="lock-arrow">&#9668;</span> Bloccata ai lati <span class="lock-arrow">&#9658;</span>';
 banner.style.left=Math.max(10, (x-120))+'px'; banner.style.top=(y-40)+'px';
 document.body.appendChild(banner);
 setTimeout(()=>banner.remove(), 1200);
}

function triggerCombo(){
 comboCount++;
 if(comboCount > maxComboInLevel) maxComboInLevel = comboCount;
 iq += 0.8 * comboCount;
 const titles=['Good!','Great!','Perfect!','Excellent!'];
 $('combo-txt').textContent=titles[Math.min(comboCount-1, titles.length-1)];
 $('combo-num').textContent='Combo x'+comboCount;
 const toast=$('combo-toast');
 toast.classList.add('show');
 setTimeout(()=>toast.classList.remove('show'), 750);
}

function click(i, ev){
 if(isAnimatingFlight) return;
 const t=T[i];
 if(blocked(t,T)){
  if(ev) showLockTooltip(ev.clientX, ev.clientY);
  return;
 }
 if(holder.length>=4) return;

 const tileEl = document.querySelector(`[data-index="${i}"]`);
 const holderBar = $('holder-bar');

 if(tileEl && holderBar){
   isAnimatingFlight = true;
   const startRect = tileEl.getBoundingClientRect();
   
   const dummySlot = document.createElement('div');
   dummySlot.style.cssText = 'width:48px;height:64px;visibility:hidden;';
   holderBar.appendChild(dummySlot);
   const targetRect = dummySlot.getBoundingClientRect();
   dummySlot.remove();

   tileEl.style.opacity = '0';

   const flyer = tileEl.cloneNode(true);
   flyer.style.opacity = '1';
   flyer.classList.add('flying');
   flyer.style.left = startRect.left + 'px';
   flyer.style.top = startRect.top + 'px';
   flyer.style.width = startRect.width + 'px';
   flyer.style.height = startRect.height + 'px';
   document.body.appendChild(flyer);

   flyer.getBoundingClientRect();

   flyer.style.left = targetRect.left + (targetRect.width - startRect.width)/2 + 'px';
   flyer.style.top = targetRect.top + (targetRect.height - startRect.height)/2 + 'px';
   flyer.style.transform = 'scale(0.9)';

   setTimeout(() => {
     flyer.remove();
     t.gone=true;
     hintIds=[];
     holder.push({tile:t, type:t.type, idx:i});
     hist.push(i);

     const matchIdx=holder.findIndex((item, index)=>index!==holder.length-1 && item.type===t.type);
     if(matchIdx!==-1){
       holder.splice(matchIdx, 1);
       holder.pop();
       triggerCombo();
     }

     isAnimatingFlight = false;
     render();
   }, 350);
 } else {
   t.gone=true;
   hintIds=[];
   holder.push({tile:t, type:t.type, idx:i});
   hist.push(i);
   render();
 }
}

function executeUndo() {
  const lastIdx = hist.pop();
  if (lastIdx !== undefined) {
    T[lastIdx].gone = false;
    holder = holder.filter(h => h.idx !== lastIdx);
    hintIds = [];
    render();
  }
}

function useOrBuySkill(type, cost, action) {
  if (isAnimatingFlight) return;
  if (uses[type] > 0) {
    uses[type]--;
    action();
  } else {
    if (gems >= cost) {
      gems -= cost;
      action();
      render();
    } else {
      showToast(`Gemme insufficienti! Servono ${cost}`);
    }
  }
}

function undo(){
 useOrBuySkill('undo', COSTS.undo, executeUndo);
}

function hint(){
 useOrBuySkill('hint', COSTS.hint, () => {
   const f=free(T);
   for(let a=0;a<f.length;a++)for(let b=a+1;b<f.length;b++)if(f[a].type===f[b].type){
     hintIds=[T.indexOf(f[a]),T.indexOf(f[b])];
     return render();
   }
 });
}

function shuffle(){
 useOrBuySkill('shuffle', COSTS.shuffle, () => {
   isNewGameAnim = true;
   const alive=T.filter(t=>!t.gone);
   if(!alive.length)return;
   const cnt={};alive.forEach(t=>cnt[t.type]=(cnt[t.type]||0)+1);
   const pt=[];for(const k in cnt)for(let i=0;i<cnt[k]/2;i++)pt.push(+k);
   const res=assignAntiNeighbor(alive,pt);if(!res)return;
   alive.forEach((t,i)=>t.type=res.get(i));
   hist=[];hintIds=[];
   render();
   setTimeout(()=>{ isNewGameAnim = false; }, 400);
 });
}

function gameOver(){
 $('modal-icon').innerHTML = '<use href="#svg-gameover"/>';
 $('ot').textContent = 'Vassoio Pieno!';
 $('op').textContent = 'Nessuno spazio rimasto nel vassoio.';
 $('reward-box').style.display = 'none';
 
 const btnUndoModal = $('btn-undo-modal');
 const btnUndoText = $('btn-undo-text');
 btnUndoModal.style.display = 'flex';
 
 if(uses.undo > 0) {
   btnUndoText.textContent = `Annulla Mossa (${uses.undo})`;
 } else {
   btnUndoText.textContent = `Annulla Mossa (💎${COSTS.undo})`;
 }

 btnUndoModal.onclick = () => {
   if(uses.undo > 0) {
     uses.undo--;
     $('ov').style.display = 'none';
     executeUndo();
   } else if(gems >= COSTS.undo) {
     gems -= COSTS.undo;
     $('ov').style.display = 'none';
     executeUndo();
   } else {
     showToast(`Gemme insufficienti! Servono ${COSTS.undo}`);
   }
 };

 $('btn-text').textContent = 'Ricomincia';
 $('on').onclick = () => newGame(lvl);
 $('ov').style.display = 'flex';
}

function win(){
 const baseReward = 3 + Math.floor(currentLevel * 1.5);
 const comboBonus = Math.floor(maxComboInLevel * 1.2);
 const iqBonus = Math.floor(iq * 0.05);
 const totalGemsGained = Math.max(3, baseReward + comboBonus + iqBonus);

 gems += totalGemsGained;

 $('modal-icon').innerHTML = '<use href="#svg-trophy"/>';
 $('ot').textContent = 'Livello Completato!';
 $('op').textContent = `IQ: ${iq.toFixed(1)} | Combo Max: x${maxComboInLevel}`;
 $('reward-box').style.display = 'flex';
 $('reward-gems').textContent = `+${totalGemsGained}`;
 
 $('btn-undo-modal').style.display = 'none';
 $('btn-text').textContent = 'Prossimo Livello';
 $('on').onclick = () => newGame(currentLevel + 1);
 $('ov').style.display = 'flex';
}

$('bh').onclick = hint;
$('bu').onclick = undo;
$('bs').onclick = shuffle;
$('br').onclick = () => newGame(currentLevel);
let rz; addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(render,150)});

newGame(0);
</script>
